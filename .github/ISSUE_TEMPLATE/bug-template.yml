name: Bug Report
description: Report a bug or crash with Stellaris
labels: [ bug ]
body:
  - type: input
    id: mc-version
    attributes:
      label: Minecraft Version
      placeholder: "Ex: 1.18.1"
    validations:
      required: true

  - type: input
    id: stellaris-version
    attributes:
      label: Stellaris Version
      placeholder: "Ex: 26.1.2-neoforge-2.0.8"
    validations:
      required: true

  - type: input
    id: logs
    attributes:
      label: Crash report/logs
      description: Paste a link to the crash report or latest.log. Use https://mclo.gs/ or another paste site of your choice
    validations:
      required: true

  - type: markdown
    attributes:
      value: "## Issue Description"

  - type: textarea
    id: description
    attributes:
      label: Describe the issue
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: How to reproduce
      placeholder: |
       1. Wear a spacesuit
       2. Go outside on the moon
       3. Suffocate
    validations:
      required: true
